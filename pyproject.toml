[project]
name = "enterprise-langgraph-platform"
version = "2.0.0"
description = "Enterprise LangGraph Platform (LGP v2.0) with 10 Subagents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "supabase>=2.0.0",
    "asyncpg>=0.29.0",
    "deepagents>=0.7.25",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.10"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
