# ==============================================================================
# Nginx Structured JSON Access Logging Configuration (SA4)
# Formats access logs as strict JSON without leaking sensitive Authorization tokens
# ==============================================================================

# Extract client identifier: prioritize HTTP Header X-Client-Id, then URL parameter client_id, default to "-"
map $http_x_client_id $mcp_client_id_from_header {
    default $http_x_client_id;
    ""      $arg_client_id;
}

map $mcp_client_id_from_header $mcp_client_id {
    default $mcp_client_id_from_header;
    ""      "-";
}

# Redact Authorization header / Bearer token to prevent credential leaks in observability pipelines
map $http_authorization $mcp_redacted_auth {
    default "[REDACTED]";
    ""      "-";
}

# Structured JSON log format
# Explicitly excludes raw $http_authorization to comply with zero token leakage policy
log_format mcp_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"client_id":"$mcp_client_id",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"request_uri":"$request_uri",'
    '"request_method":"$request_method",'
    '"http_user_agent":"$http_user_agent",'
    '"bytes_sent":$bytes_sent,'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"'
'}';
