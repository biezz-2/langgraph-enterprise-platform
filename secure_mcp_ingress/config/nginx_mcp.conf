# ==============================================================================
# Nginx Reverse Proxy Configuration for Secure MCP & SSE Gateway (SA4)
# Optimized for long-lived streaming, low latency, and zero-buffering
# ==============================================================================

# Rate limiting zone for MCP clients (30 requests/sec with 10MB state store)
limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=30r/s;

# Upstream MCP server pool with keepalive connection pooling
upstream mcp_backend {
    server 127.0.0.1:8787;
    keepalive 64;
}

server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name mcp.domainanda.com localhost _;

    # Access and Error Logging
    access_log /var/log/nginx/access.log mcp_json;
    error_log  /var/log/nginx/error.log warn;

    # Global proxy settings for SSE and long-lived streaming
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Latency optimization for chunked Server-Sent Events
    chunked_transfer_encoding on;
    proxy_set_header X-Accel-Buffering no;
    tcp_nodelay on;

    # Internal Healthcheck Endpoint
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","timestamp":"$time_iso8601","service":"secure-mcp-proxy"}\n';
    }

    # RFC 9728 OAuth 2.0 Protected Resource Metadata
    location = /.well-known/oauth-protected-resource {
        alias /etc/nginx/auth/protected_resource_metadata.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Fallback path for protected resource metadata if accessed with trailing slash
    location = /.well-known/oauth-protected-resource/ {
        return 301 /.well-known/oauth-protected-resource;
    }

    # MCP SSE & API Routing with rate limiting
    location / {
        limit_req zone=mcp_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://mcp_backend;
    }
}
